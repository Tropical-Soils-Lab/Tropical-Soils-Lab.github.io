content:
- name: news
  label: News & Lab Highlights
  type: file
  path: data/news.json
  format: json
  fields:
  - name: items
    label: Items
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: slug
      label: Slug
      type: string
      required: true
      description: Unique lowercase words separated by hyphens. Keep this unchanged
        after publishing to preserve article links.
    - name: date
      label: Date
      type: date
      options:
        format: yyyy-MM-dd
      required: true
    - name: category
      label: Category
      type: select
      options:
        values:
        - Lab updates
        - Publications
        - Tools
        - Media
        - Highlights
      required: true
    - name: title
      label: Title
      type: string
      required: true
    - name: summary
      label: Summary
      type: text
    - name: paragraphs
      label: Paragraphs
      type: text
      list: true
    - name: source_label
      label: Source label
      type: string
    - name: source
      label: Source
      type: string
    - name: image
      label: Image
      type: image
    - name: image_alt
      label: Image alt
      type: string
      description: Describe the image for visitors using screen readers.
    - name: linkedin_url
      label: Linkedin url
      type: string
      description: 'For Highlights: paste the complete LinkedIn post URL. The homepage
        shows the newest published highlight.'
    - name: published
      label: Published
      type: boolean
      default: false
